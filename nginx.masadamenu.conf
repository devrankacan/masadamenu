server {
    server_name masadamenu.com.tr www.masadamenu.com.tr;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    root /var/www/masadamenu;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Palet Pastanesi QR Menu - DOKUNMA
    location ^~ /paletpastanesi {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/masadamenu.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masadamenu.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.masadamenu.com.tr) {
        return 301 https://$host$request_uri;
    }
    if ($host = masadamenu.com.tr) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name masadamenu.com.tr www.masadamenu.com.tr;
    return 404;
}
